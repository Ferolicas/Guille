name: Deploy a VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-guille
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/guille-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/guille-ssh/key"
          chmod 600 "$RUNNER_TEMP/guille-ssh/key"
          ssh -i "$RUNNER_TEMP/guille-ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "bash /var/www/guille/deploy.sh"
